version: "3.8"

x-db-env: &db-env
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vellastra?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
  SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-1234567}

x-redis-env: &redis-env
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}

services:
  mysql:
    image: mysql:8.0
    container_name: vellastra-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234567}
      MYSQL_DATABASE: vellastra
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - ./data/sql/blog_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-1234567}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - vellastra-net

  redis:
    image: redis:7-alpine
    container_name: vellastra-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vellastra-net

  gateway:
    build: ./vellastra-gateway
    container_name: vellastra-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - user
      - article
      - category
      - comment
      - tag
      - file
    environment:
      <<: *redis-env
    networks:
      - vellastra-net

  auth:
    build: ./vellastra-auth
    container_name: vellastra-auth
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env]
    networks:
      - vellastra-net

  user:
    build: ./vellastra-user
    container_name: vellastra-user
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env]
    networks:
      - vellastra-net

  article:
    build: ./vellastra-article
    container_name: vellastra-article
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env]
    networks:
      - vellastra-net

  category:
    build: ./vellastra-category
    container_name: vellastra-category
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env]
    networks:
      - vellastra-net

  comment:
    build: ./vellastra-comment
    container_name: vellastra-comment
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env]
    networks:
      - vellastra-net

  file:
    build: ./vellastra-file
    container_name: vellastra-file
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env]
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - uploads-data:/uploads
    networks:
      - vellastra-net

  tag:
    build: ./vellastra-tag
    container_name: vellastra-tag
    ports:
      - "8087:8087"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env]
    networks:
      - vellastra-net

  publish:
    build: ./vellastra-publish
    container_name: vellastra-publish
    ports:
      - "8088:8088"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env]
    networks:
      - vellastra-net

  recycle:
    build: ./vellastra-recycle
    container_name: vellastra-recycle
    ports:
      - "8089:8089"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env]
    networks:
      - vellastra-net

  analytics:
    build: ./vellastra-analytics
    container_name: vellastra-analytics
    ports:
      - "8090:8090"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env]
    networks:
      - vellastra-net

  column:
    build: ./vellastra-column
    container_name: vellastra-column
    ports:
      - "8091:8091"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env]
    networks:
      - vellastra-net

  mail:
    build: ./vellastra-mail
    container_name: vellastra-mail
    ports:
      - "8092:8092"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env]
    networks:
      - vellastra-net

  minio:
    image: minio/minio:latest
    container_name: vellastra-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vellastra-net

volumes:
  mysql-data:
  redis-data:
  uploads-data:
  minio-data:

networks:
  vellastra-net:
    driver: bridge
