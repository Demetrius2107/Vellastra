version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: vellastra-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234567
      MYSQL_DATABASE: vellastra
    ports:
      - "3306:3306"
    volumes:
      - ../../data/sql/blog_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vellastra-net

  gateway:
    build: .
    container_name: vellastra-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - user
      - article
    networks:
      - vellastra-net

volumes:
  mysql-data:

networks:
  vellastra-net:
    driver: bridge
